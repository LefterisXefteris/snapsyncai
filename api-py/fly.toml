# Fly.io deployment for the FastAPI service.
#
#   fly launch --no-deploy --copy-config --name snapsyncai-api
#   fly secrets set DATABASE_URL="..." CLERK_SECRET_KEY="..." CLERK_PUBLISHABLE_KEY="..." \
#                   STRIPE_PUBLISHABLE_KEY="..." APP_BASE_URL="https://www.snapsyncai.co.uk"
#   fly deploy
#
# Then point production at it by adding rewrites to ../vercel.json — see the comment
# block at the top of that file.

app = "snapsyncai-api"
primary_region = "lhr"  # London — same side of the Atlantic as the Supabase eu-west-2 pooler

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  PORT = "8000"
  # DATABASE_POOL_MAX stays modest: this is a long-lived process behind Supabase's
  # transaction pooler, not a serverless fan-out, so a handful of connections is plenty.
  DATABASE_POOL_MAX = "10"

[processes]
  app = "uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"

[http_service]
  internal_port = 8000
  processes = ["app"]
  force_https = true
  # NOT auto-stopping. Cold starts were a large part of why we are leaving serverless,
  # and the whole point of a container host is that the process stays warm.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  # /api/health does not touch the database, so a Supabase blip cannot take the
  # service out of rotation. Use /api/health/db for a deeper manual check.
  path = "/api/health"
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
