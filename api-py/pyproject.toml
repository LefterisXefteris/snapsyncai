[project]
name = "snapsyncai-api"
version = "0.1.0"
description = "SnapSync AI backend — FastAPI"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "clerk-backend-api>=2.0",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "cryptography>=44.0",
    "openai>=1.60",
    "stripe>=11.4",
    "supabase>=2.11",
    "resend>=2.6",
    "sentry-sdk[fastapi]>=2.20",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `Depends(...)` / `File(...)` in argument defaults is the FastAPI idiom, not a bug.
extend-ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
