# Use this file only when the Railway service Root Directory is `api-py`.
# For a repo-root service (the default), use the railway.toml at the repo root.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
