# Local Redis for development.
#
# Local Postgres and Storage come from `supabase start` (see supabase/config.toml).
# Production Postgres is the existing cloud Supabase project; production Redis is
# a Railway plugin. This compose file only replaces Redis so you are never
# pointing the catalogue cache at live data.
#
#   npx supabase start
#   cd api-py && uv run alembic upgrade head
#
# Redis is optional: if REDIS_URL is unset, GET /api/images hits Postgres only.
#
services:
  redis:
    image: redis:7-alpine
    container_name: snapsyncai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - snapsyncai-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  snapsyncai-redis:
