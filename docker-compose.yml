# Local Postgres and Redis for development and tests.
#
# Production Postgres is Supabase; production Redis is a Railway plugin. This compose
# file only replaces those for local work so you are never pointing migrations, tests,
# or the catalogue cache at live data. Supabase Storage is a separate dependency and
# is not stubbed here — image uploads still need real SUPABASE_URL / SUPABASE_ANON_KEY,
# or they fail at call time (nothing else breaks).
#
#   docker compose up -d
#   cd api-py && DATABASE_URL=... uv run alembic upgrade head
#
# Redis is optional: if REDIS_URL is unset, GET /api/images hits Postgres only.
#
services:
  postgres:
    # Match your Supabase major version — check Settings -> Infrastructure in the
    # dashboard. Newer projects are on 17, older ones 15.
    image: postgres:17-alpine
    container_name: snapsyncai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: snapsync
      POSTGRES_PASSWORD: snapsync
      POSTGRES_DB: snapsync
    ports:
      - "5433:5432" # 5433 on the host, so it can't collide with a local Postgres
    volumes:
      - snapsyncai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapsync -d snapsync"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: snapsyncai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - snapsyncai-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  snapsyncai-pgdata:
  snapsyncai-redis:
